[package]
name = "rhwp-desktop"
version = "0.1.0"
edition = "2021"
autobins = false
default-run = "rhwp"

[[bin]]
name = "rhwp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rfd = "0.15"
chrono = { version = "0.4", features = ["clock"] }
