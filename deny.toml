[graph]
all-features = false

[advisories]
version = 2
ignore = [
  # Direct macro dependency used in WMF parser helpers; replace in a later refactor.
  "RUSTSEC-2024-0436",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-DFS-2016",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "allow"
