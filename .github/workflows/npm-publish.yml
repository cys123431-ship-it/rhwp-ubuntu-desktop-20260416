name: Publish All Packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-

      - name: Build WASM
        run: wasm-pack build --target web --release

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: pkg/

  publish-npm-core:
    name: Publish @rhwp/core
    needs: build-wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: pkg/

      - name: Prepare npm package
        run: bash scripts/prepare-npm.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Detect npm token
        id: npm-token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN is not configured. Skipping @rhwp/core publish."
          fi

      - name: Publish to npm
        if: steps.npm-token.outputs.available == 'true'
        working-directory: pkg
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-npm-editor:
    name: Publish @rhwp/editor
    needs: build-wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Detect npm token
        id: npm-token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN is not configured. Skipping @rhwp/editor publish."
          fi

      - name: Publish to npm
        if: steps.npm-token.outputs.available == 'true'
        working-directory: npm/editor
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-vscode:
    name: Publish VSCode Extension
    needs: build-wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: pkg/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: rhwp-vscode
        run: npm install

      - name: Copy logo
        run: cp assets/logo/logo-128.png rhwp-vscode/media/icon.png

      - name: Copy WASM files
        run: |
          cp pkg/rhwp_bg.wasm rhwp-vscode/media/
          cp pkg/rhwp.js rhwp-vscode/media/

      - name: Build extension
        working-directory: rhwp-vscode
        run: npm run compile

      - name: Detect VS Code Marketplace token
        id: vsce-token
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "VSCE_PAT is not configured. Skipping VS Code Marketplace publish."
          fi

      - name: Publish to VS Code Marketplace
        if: steps.vsce-token.outputs.available == 'true'
        working-directory: rhwp-vscode
        run: npx @vscode/vsce publish -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Detect Open VSX token
        id: ovsx-token
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OVSX_PAT is not configured. Skipping Open VSX publish."
          fi

      - name: Publish to Open VSX
        if: steps.ovsx-token.outputs.available == 'true'
        working-directory: rhwp-vscode
        run: npx ovsx publish -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
