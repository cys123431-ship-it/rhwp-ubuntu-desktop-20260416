name: Ubuntu Desktop Package

on:
  push:
    branches: [main, devel]
    tags: ['v*']
  pull_request:
    branches: [main, devel]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-deb:
    name: Build Ubuntu .deb
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            desktop-file-utils \
            shared-mime-info

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            rhwp-studio/package-lock.json
            rhwp-desktop/package-lock.json

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run Wave 2 Rust regression suite
        run: |
          cargo nextest run --profile ci --lib serializer::hwpx_writer::tests_clean
          INSTA_UPDATE=no cargo nextest run --profile ci --lib compatibility_report_snapshot

      - name: Run cargo-deny
        run: cargo deny check advisories bans licenses sources

      - name: Build WASM package
        run: wasm-pack build --target web --out-dir pkg

      - name: Build studio frontend
        working-directory: rhwp-studio
        run: |
          npm ci
          npm run build

      - name: Generate synthetic phase1 HWPX fixtures
        run: cargo run --quiet --bin rhwp -- compat-generate-fixtures compatibility-corpus/fixtures

      - name: Validate phase1 supported corpus
        run: cargo run --quiet --bin rhwp -- compat-corpus compatibility-corpus/phase1-supported.tsv

      - name: Validate phase1 protected corpus
        run: cargo run --quiet --bin rhwp -- compat-corpus compatibility-corpus/phase1-protected.tsv

      - name: Validate phase2 extended corpus
        run: |
          mkdir -p compatibility-reports/phase2-extended
          cargo run --quiet --bin rhwp -- compat-corpus --json --emit-reports compatibility-reports/phase2-extended compatibility-corpus/phase2-extended.tsv > compatibility-reports/phase2-summary.json

      - name: Publish compatibility summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          summary = json.loads(Path("compatibility-reports/phase2-summary.json").read_text(encoding="utf-8"))
          entries = summary["entries"]
          protected = [entry for entry in entries if entry.get("editMode") == "protected-view"]
          warnings = [entry for entry in entries if "hwpx-shape-unsupported" in entry.get("issueCodes", [])]
          wave2 = [
              entry for entry in entries
              if entry["path"] in {
                  "../samples/tac-img-02.hwpx",
                  "fixtures/basic-shape.hwpx",
                  "fixtures/textbox-in-shape.hwpx",
                  "fixtures/picture-caption.hwpx",
                  "fixtures/shape-group.hwpx",
              }
          ]

          print("## Wave 2 Compatibility Summary")
          print()
          print(f"- Manifest: `{summary['manifest']}`")
          print(f"- Total entries: `{summary['totalEntries']}`")
          print(f"- Failures: `{summary['failures']}`")
          print(f"- Protected-view entries: `{len(protected)}`")
          print(f"- Preserve-only warning entries: `{len(warnings)}`")
          print()
          print("### Wave 2 promoted documents")
          for entry in wave2:
              print(f"- `{entry['path']}` -> `{entry.get('editMode', 'unknown')}`")
          if protected:
              print()
              print("### Remaining protected-view blockers")
              for entry in protected:
                  print(f"- `{entry['path']}` -> {', '.join(entry.get('issueCodes', []))}")
          PY

      - name: Build Ubuntu package
        working-directory: rhwp-desktop
        run: |
          npm ci
          npm run build:linux

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: rhwp-ubuntu-deb
          path: rhwp-desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload compatibility reports
        uses: actions/upload-artifact@v4
        with:
          name: rhwp-compatibility-reports
          path: compatibility-reports/**
          if-no-files-found: error
          retention-days: 30

  install-smoke-test:
    name: Install Smoke Test
    runs-on: ${{ matrix.ubuntu-version }}
    needs: build-deb
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ubuntu-version: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v5

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libwebkit2gtk-4.1-0 \
            xdg-utils \
            desktop-file-utils \
            shared-mime-info \
            libglib2.0-bin \
            xvfb

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: rhwp-ubuntu-deb
          path: dist

      - name: Install package
        run: |
          sudo apt-get install -y ./dist/*.deb

      - name: Verify desktop integration assets
        run: |
          dpkg -L rhwp | grep '/usr/share/applications/rhwp.desktop'
          dpkg -L rhwp | grep '/usr/share/mime/packages/rhwp-mime.xml'
          dpkg -L rhwp | grep '/usr/bin/rhwp$'
          desktop-file-validate /usr/share/applications/rhwp.desktop
          update-mime-database /usr/share/mime

      - name: Verify file association command
        run: |
          xdg-mime default rhwp.desktop application/x-hwp
          xdg-mime default rhwp.desktop application/x-hwpx
          test "$(xdg-mime query default application/x-hwp)" = "rhwp.desktop"
          test "$(xdg-mime query default application/x-hwpx)" = "rhwp.desktop"

      - name: Launch app with sample HWP file
        run: |
          sample_path="$GITHUB_WORKSPACE/samples/re-01-hangul-only.hwp"
          test -f "$sample_path"
          set +e
          xvfb-run -a timeout 20s rhwp "$sample_path"
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

      - name: Launch app with sample HWPX file
        run: |
          sample_path="$GITHUB_WORKSPACE/samples/table-vpos-01.hwpx"
          test -f "$sample_path"
          set +e
          xvfb-run -a timeout 20s rhwp "$sample_path"
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

  publish-release:
    name: Upload Debian Package To Release
    runs-on: ubuntu-24.04
    needs: [build-deb, install-smoke-test]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: rhwp-ubuntu-deb
          path: dist

      - name: Attach Debian package to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
