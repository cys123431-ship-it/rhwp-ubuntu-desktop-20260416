name: Ubuntu Desktop Package

on:
  push:
    branches: [main, devel]
    tags: ['v*']
  pull_request:
    branches: [main, devel]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-deb:
    name: Build Ubuntu .deb
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            desktop-file-utils \
            shared-mime-info

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            rhwp-studio/package-lock.json
            rhwp-desktop/package-lock.json

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run compatibility Rust regression suite
        run: |
          cargo nextest run --profile ci --lib serializer::hwpx_writer::tests_clean
          INSTA_UPDATE=no cargo nextest run --profile ci --lib compatibility_report_snapshot
          cargo nextest run --profile ci --lib hyperlink
          cargo nextest run --profile ci --lib field_overlap
          cargo nextest run --profile ci --lib wave5_metadata
          cargo nextest run --profile ci --lib unknown_control

      - name: Run cargo-deny
        run: cargo deny check advisories bans licenses sources

      - name: Build WASM package
        run: wasm-pack build --target web --out-dir pkg

      - name: Build studio frontend
        working-directory: rhwp-studio
        run: |
          npm ci
          npm run build

      - name: Generate synthetic phase1 HWPX fixtures
        run: cargo run --quiet --bin rhwp -- compat-generate-fixtures compatibility-corpus/fixtures

      - name: Validate phase1 supported corpus
        run: cargo run --quiet --bin rhwp -- compat-corpus compatibility-corpus/phase1-supported.tsv

      - name: Validate phase1 protected corpus
        run: |
          mkdir -p compatibility-reports/phase1-protected
          cargo run --quiet --bin rhwp -- compat-corpus --json --emit-reports compatibility-reports/phase1-protected compatibility-corpus/phase1-protected.tsv > compatibility-reports/phase1-protected-summary.json

      - name: Validate phase2 extended corpus
        run: |
          mkdir -p compatibility-reports/phase2-extended
          cargo run --quiet --bin rhwp -- compat-corpus --json --emit-reports compatibility-reports/phase2-extended compatibility-corpus/phase2-extended.tsv > compatibility-reports/phase2-summary.json

      - name: Publish compatibility summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          protected_summary = json.loads(
              Path("compatibility-reports/phase1-protected-summary.json").read_text(encoding="utf-8")
          )
          summary = json.loads(Path("compatibility-reports/phase2-summary.json").read_text(encoding="utf-8"))
          entries = summary["entries"]
          protected = [entry for entry in entries if entry.get("editMode") == "protected-view"]
          warnings = [entry for entry in entries if "hwpx-shape-unsupported" in entry.get("issueCodes", [])]
          wave2 = [
              entry for entry in entries
              if entry["path"] in {
                  "../samples/tac-img-02.hwpx",
                  "fixtures/basic-shape.hwpx",
                  "fixtures/textbox-in-shape.hwpx",
                  "fixtures/picture-caption.hwpx",
                  "fixtures/shape-group.hwpx",
              }
          ]
          wave4 = [
              entry for entry in entries
              if entry["path"] in {
                  "fixtures/equation-basic.hwpx",
                  "fixtures/ruby-basic.hwpx",
                  "fixtures/hidden-comment.hwpx",
              }
          ]

          print("## Wave 2 Compatibility Summary")
          print()
          print(f"- Manifest: `{summary['manifest']}`")
          print(f"- Total entries: `{summary['totalEntries']}`")
          print(f"- Failures: `{summary['failures']}`")
          print(f"- Protected-view entries: `{len(protected)}`")
          print(f"- Preserve-only warning entries: `{len(warnings)}`")
          print()
          print("### Wave 2 promoted documents")
          for entry in wave2:
              print(f"- `{entry['path']}` -> `{entry.get('editMode', 'unknown')}`")
          print()
          print("### Wave 4 promoted documents")
          for entry in wave4:
              print(f"- `{entry['path']}` -> `{entry.get('editMode', 'unknown')}` / `{entry.get('roundtripMode', 'none')}`")
          print()
          print("### Wave 3 preservation policy")
          print("- Native hyperlink field fixture `fixtures/hyperlink-field.hwpx` is promoted to `phase1-supported`.")
          print("- Simple inline `Control::Hyperlink` cases are rewritten as native HWPX hyperlink fields when display text is available.")
          print("- Clean snapshot-backed hyperlink controls stay `editable-safe` with `hwpx-hyperlink` as a warning.")
          print("- Clean snapshot-backed field/char-overlap controls stay `editable-safe` with `hwpx-field-missing-range` and `hwpx-char-overlap` as warnings.")
          print("- Dirty sections with hyperlink controls escalate back to `protected-view`.")
          print("- Dirty sections with field or char-overlap controls also escalate back to `protected-view`.")
          print()
          print("### Wave 5 preservation policy")
          print("- Clean snapshot-backed metadata stays `editable-safe` with warning severity.")
          print("- Dirty metadata or dirty sections escalate back to `protected-view` blockers.")
          print("- Covered issue codes: `hwpx-docinfo-extra-records`, `hwpx-section-page-border-fill`, `hwpx-section-master-pages`, `hwpx-section-extra-records`, `hwpx-unknown-control`.")
          print("- Fixture `fixtures/unknown-control.hwpx` stays `editable-safe` in `phase2-extended.tsv` with `hwpx-unknown-control` as a warning.")
          print("- Fixture `fixtures/wave5-metadata.hwpx` stays `editable-safe` in `phase2-extended.tsv` with `hwpx-section-page-border-fill` and `hwpx-section-master-pages` as warnings.")
          print()
          print("### Phase 1 protected scenarios")
          print(f"- Manifest: `{protected_summary['manifest']}`")
          print(f"- Total entries: `{protected_summary['totalEntries']}`")
          for entry in protected_summary["entries"]:
              print(f"- `{entry['path']}` -> `{entry.get('editMode', 'unknown')}`")
          if protected:
              print()
              print("### Remaining protected-view blockers")
              for entry in protected:
                  print(f"- `{entry['path']}` -> {', '.join(entry.get('issueCodes', []))}")
          PY

      - name: Build Ubuntu package
        working-directory: rhwp-desktop
        run: |
          npm ci
          npm run build:linux

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: rhwp-ubuntu-deb
          path: rhwp-desktop/src-tauri/target/**/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload compatibility reports
        uses: actions/upload-artifact@v4
        with:
          name: rhwp-compatibility-reports
          path: compatibility-reports/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload nextest JUnit report
        uses: actions/upload-artifact@v4
        with:
          name: rhwp-nextest-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 30

      - name: Upload compatibility result baselines
        uses: actions/upload-artifact@v4
        with:
          name: rhwp-compatibility-baselines
          path: compatibility-corpus/results/**
          if-no-files-found: error
          retention-days: 30

  install-smoke-test:
    name: Install Smoke Test
    runs-on: ${{ matrix.ubuntu-version }}
    needs: build-deb
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ubuntu-version: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rhwp-desktop/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libwebkit2gtk-4.1-0 \
            webkit2gtk-driver \
            xdg-utils \
            desktop-file-utils \
            shared-mime-info \
            libglib2.0-bin \
            xvfb

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: rhwp-ubuntu-deb
          path: dist

      - name: Install package
        run: |
          DEB_PATH="$(find dist -type f -name '*.deb' | head -n 1)"
          test -n "$DEB_PATH"
          sudo apt-get install -y "$DEB_PATH"

      - name: Verify desktop integration assets
        run: |
          dpkg -L rhwp | grep '/usr/share/applications/rhwp.desktop'
          dpkg -L rhwp | grep '/usr/share/mime/packages/rhwp-mime.xml'
          dpkg -L rhwp | grep '/usr/bin/rhwp$'
          desktop-file-validate /usr/share/applications/rhwp.desktop
          update-mime-database /usr/share/mime

      - name: Install WebDriver test dependencies
        working-directory: rhwp-desktop
        run: npm ci

      - name: Run Wave 2 desktop end-to-end tests
        working-directory: rhwp-desktop
        env:
          RHWP_E2E_APP: /usr/bin/rhwp
        run: |
          xvfb-run -a npm run e2e:installed

      - name: Verify file association command
        run: |
          test "$(xdg-mime query default application/x-hwp)" = "rhwp.desktop"
          test "$(xdg-mime query default application/x-hwpx)" = "rhwp.desktop"

      - name: Publish desktop E2E summary
        run: |
          {
            echo "## Ubuntu Desktop E2E"
            echo
            echo "- Installed package: \`rhwp\`"
            echo "- Display matrix target: \`${{ matrix.ubuntu-version }}\`"
            echo "- Verified: first-run default-app banner, HWPX startup open, recovery restore/delete, multi-window startup fan-out"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Upload Debian Package To Release
    runs-on: ubuntu-24.04
    needs: [build-deb, install-smoke-test]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: rhwp-ubuntu-deb
          path: dist

      - name: Attach Debian package to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.deb
