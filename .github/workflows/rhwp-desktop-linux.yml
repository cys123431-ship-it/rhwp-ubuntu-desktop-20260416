name: Ubuntu Desktop Package

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-deb:
    name: Build Ubuntu .deb
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            desktop-file-utils \
            shared-mime-info

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            rhwp-studio/package-lock.json
            rhwp-desktop/package-lock.json

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build WASM package
        run: wasm-pack build --target web --out-dir pkg

      - name: Build studio frontend
        working-directory: rhwp-studio
        run: |
          npm ci
          npm run build

      - name: Build Ubuntu package
        working-directory: rhwp-desktop
        run: |
          npm ci
          npm run build:linux

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: rhwp-ubuntu-deb
          path: rhwp-desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

  install-smoke-test:
    name: Install Smoke Test
    runs-on: ubuntu-24.04
    needs: build-deb
    permissions:
      contents: read

    steps:
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libwebkit2gtk-4.1-0 \
            xdg-utils

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: rhwp-ubuntu-deb
          path: dist

      - name: Install package
        run: |
          sudo apt-get install -y ./dist/*.deb

      - name: Verify desktop integration assets
        run: |
          dpkg -L rhwp | grep '/usr/share/applications/rhwp.desktop'
          dpkg -L rhwp | grep '/usr/share/mime/packages/rhwp-mime.xml'
